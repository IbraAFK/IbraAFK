<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 300" width="120" height="300" role="img" aria-label="nnU-Net: does the cutting">
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#66737f"/><stop offset=".38" stop-color="#e3e9ee"/>
      <stop offset=".6" stop-color="#aeb9c3"/><stop offset="1" stop-color="#5b6772"/>
    </linearGradient>
    <linearGradient id="tray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2830"/><stop offset="1" stop-color="#161d24"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9f3f0"/><stop offset=".5" stop-color="#7fb9b4"/><stop offset="1" stop-color="#2f5f5d"/>
    </linearGradient>
    <pattern id="gauze" width="5" height="5" patternUnits="userSpaceOnUse">
      <path d="M0 0H5M0 0V5" stroke="#aab5c0" stroke-width=".7"/>
    </pattern>
    <filter id="drop" x="-60%" y="-10%" width="220%" height="125%">
      <feDropShadow dx="3" dy="4" stdDeviation="3" flood-color="#000" flood-opacity=".55"/>
    </filter>
    <g id="rod">
      <path d="M-3.500 96H3.500L4 186Q0 192-4 186Z" fill="url(#steel)"/>
      <path d="M-3.500 112H3.500M-3.500 118H3.500M-3.500 124H3.500M-3.500 130H3.500M-3.500 136H3.500M-3.500 142H3.500M-3.500 148H3.500" stroke="#4b5761" stroke-width="1.2"/>
    </g>
  
    <radialGradient id="lamp" cx=".5" cy=".35" r=".7">
      <stop offset="0" stop-color="#5ecfc6" stop-opacity=".22"/><stop offset="1" stop-color="#5ecfc6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
    .ink{fill:#e7ebef}.faint{fill:#616b75}.teal{fill:#5ecfc6}
    .lamp{opacity:0;animation:lamp 10.5s linear 0.0s infinite}
    .glint{animation:glint 6s ease-in-out infinite}
    @keyframes lamp{0%{opacity:0}5%{opacity:1}15%,100%{opacity:0}}
    @keyframes glint{0%,70%,100%{opacity:0}80%{opacity:.9}}
    @media (prefers-reduced-motion:reduce){.lamp,.glint{animation:none}}
  </style>
  <rect x="1.500" y=".500" width="117" height="299" rx="10" fill="#0c1116" stroke="#1e262e"/>
  <rect x="8" y="8" width="104" height="226" rx="12" fill="url(#tray)" stroke="#3b4955" stroke-width="1.500"/>
  <rect x="13" y="13" width="94" height="216" rx="8" fill="none" stroke="#0a0e12" stroke-width="2"/>
  <rect class="lamp" x="8" y="8" width="104" height="226" rx="12" fill="url(#lamp)" stroke="#5ecfc6" stroke-width="1.600"/>
  <path d="M97 27L104 20M98.500 20H104V25.500" fill="none" stroke="#616b75" stroke-width="1.400" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="lamp" d="M97 27L104 20M98.500 20H104V25.500" fill="none" stroke="#5ecfc6" stroke-width="1.400" stroke-linecap="round" stroke-linejoin="round"/>
  <g filter="url(#drop)"><g transform="translate(60 26)">
    <path d="M-4.500 74H4.500L5 184Q0 191-5 184Z" fill="url(#steel)"/>
      <path d="M-4.500 84H4.500M-4.500 89H4.500M-4.500 94H4.500M-4.500 99H4.500M-4.500 104H4.500" stroke="#4b5761" stroke-width="1.2"/>
      <path d="M-2.500 60H2.500L4.500 74H-4.500Z" fill="url(#steel)"/>
      <path d="M-3 62V16C-3 10 0 6 2 9C6 14 7.500 24 6.500 34L4 62Z" fill="#eef2f5" stroke="#7d8a96" stroke-width=".8"/>
      <rect x="-.800" y="38" width="2.400" height="16" rx="1.200" fill="#1a222a"/>
      <path class="glint" d="M5 14L6.500 30" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>
  </g></g>
  <g class="mono" text-anchor="middle">
    <text x="60" y="262" class="ink" font-size="11">nnU-Net</text>
    <text x="60" y="279" class="faint" font-size="9.500">does the cutting</text>
  </g>
</svg>

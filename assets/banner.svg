<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 368" width="840" height="368" role="img" aria-labelledby="t d">
  <title id="t">Wisdom teeth, measured: CANDID finds the nerve on a CBCT and shows how close the tooth sits</title>
  <desc id="d">A stylised dental scan. An impacted lower wisdom tooth leans on its neighbour, the nerve canal runs beneath it, and a caliper measures the gap between them: 0.4 millimetres, which is far too close for comfort.</desc>
  <defs>
    <linearGradient id="tooth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3e9ee"/>
      <stop offset=".45" stop-color="#bcc7d0"/>
      <stop offset="1" stop-color="#8996a2"/>
    </linearGradient>
    <linearGradient id="bone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#27323c"/>
      <stop offset="1" stop-color="#18202a"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5ecfc6" stop-opacity="0"/>
      <stop offset=".85" stop-color="#5ecfc6" stop-opacity=".16"/>
      <stop offset="1" stop-color="#5ecfc6" stop-opacity=".5"/>
    </linearGradient>
    <radialGradient id="vignette" cx=".5" cy=".5" r=".75">
      <stop offset=".55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".6"/>
    </radialGradient>
    <pattern id="trab" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M2 5c3-3 6-3 9 0M10 14c3-3 5-3 7 0M1 14c1-2 3-2 5 0" fill="none" stroke="#3b4955" stroke-width="1" stroke-linecap="round"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation=".7"/></filter>
    <path id="molar" pathLength="1" transform="translate(50 3) scale(1.76)" d="M-19 30C-24 24-25 12-21 5C-18 0-13-1-10 3C-7 6-4 6-1 3C2-1 8-1 11 3C13 6 15 5 17 3C20 0 23 4 23 10C24 18 22 25 19 30C20 38 21 50 19 64C18 74 15 81 12 81C9 81 8 72 7 62C6 50 4 42 0 40C-4 42-6 52-7 64C-8 76-11 84-14 84C-18 84-20 72-21 60C-22 48-21 38-19 30Z"/>
    <g id="toothArt" transform="translate(50 3) scale(1.76)">
      <path d="M-19 30C-24 24-25 12-21 5C-18 0-13-1-10 3C-7 6-4 6-1 3C2-1 8-1 11 3C13 6 15 5 17 3C20 0 23 4 23 10C24 18 22 25 19 30C20 38 21 50 19 64C18 74 15 81 12 81C9 81 8 72 7 62C6 50 4 42 0 40C-4 42-6 52-7 64C-8 76-11 84-14 84C-18 84-20 72-21 60C-22 48-21 38-19 30Z" fill="#b1bdc7" stroke="#05070a" stroke-opacity=".7" stroke-width="1.6" paint-order="stroke"/>
      <path d="M-19 30C-24 24-25 12-21 5C-18 0-13-1-10 3C-7 6-4 6-1 3C2-1 8-1 11 3C13 6 15 5 17 3C20 0 23 4 23 10C24 18 22 25 19 30C10 27-10 27-19 30Z" fill="#eef3f6"/>
      <path d="M-16 30C-19 22-19 13-16 9C-12 6-6 10 0 9C6 10 13 6 17 10C20 16 18 24 16 30Z" fill="#b1bdc7"/>
      <path d="M-10 26C-11 20-8 17-5 19C-2 21 2 21 5 19C8 17 12 20 11 26C11 32 13 40 14 52C15 62 14 72 12.5 76L11.5 76C11.5 66 10 50 7 38C5 33 3 32 0 32C-3 32-5 33-7 38C-10 50-13 64-14 78L-15 78C-16 66-15 50-13 40C-11 34-10 30-10 26Z" fill="#414d58"/>
    </g>
    <clipPath id="pane"><rect width="388" height="312" rx="10"/></clipPath>
  </defs>
  <style>
    .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
    .dim{fill:#9aa5af}.soft{fill:#b7c0c8}.faint{fill:#616b75}.ink{fill:#e7ebef}.teal{fill:#5ecfc6}.amber{fill:#d3a63f}
    .draw{stroke-dasharray:1;stroke-dashoffset:0}
    .segTooth{animation:segTooth 20s linear infinite}
    .segFill{opacity:.2;animation:segFill 20s linear infinite}
    .segCanal{animation:segCanal 20s linear infinite}
    .canalFill{opacity:.22;animation:canalFill 20s linear infinite}
    .caliper{animation:caliper 20s linear infinite}
    .danger{animation:danger 20s linear infinite;transform-box:fill-box;transform-origin:center}
    .labA{animation:labA 20s linear infinite}
    .labB{opacity:0;animation:labB 20s linear infinite}
    .sweep{animation:sweep 7s linear infinite}
        .pulse{animation:pulse 2.4s ease-in-out infinite}
    @keyframes segTooth{0%,5%{stroke-dashoffset:1;opacity:1}20%,92%{stroke-dashoffset:0;opacity:1}97%,100%{stroke-dashoffset:0;opacity:0}}
    @keyframes segFill{0%,18%{opacity:0}24%,92%{opacity:.2}97%,100%{opacity:0}}
    @keyframes segCanal{0%,22%{stroke-dashoffset:1;opacity:1}36%,92%{stroke-dashoffset:0;opacity:1}97%,100%{stroke-dashoffset:0;opacity:0}}
    @keyframes canalFill{0%,34%{opacity:0}40%,92%{opacity:.22}97%,100%{opacity:0}}
    @keyframes caliper{0%,38%{stroke-dashoffset:1;opacity:1}44%,92%{stroke-dashoffset:0;opacity:1}97%,100%{stroke-dashoffset:0;opacity:0}}
    @keyframes danger{0%,38%{opacity:0;transform:scale(2.2)}44%{opacity:1;transform:scale(1)}50%{transform:scale(1.25)}56%{transform:scale(1)}62%{transform:scale(1.25)}68%,92%{opacity:1;transform:scale(1)}97%,100%{opacity:0;transform:scale(1)}}
    @keyframes labA{0%,44%{opacity:0}47%,66%{opacity:1}69%,100%{opacity:0}}
    @keyframes labB{0%,70%{opacity:0}73%,90%{opacity:1}93%,100%{opacity:0}}
    @keyframes sweep{0%{transform:translateX(-140px)}100%{transform:translateX(400px)}}
    @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    @media (prefers-reduced-motion:reduce){.segTooth,.segFill,.segCanal,.canalFill,.caliper,.danger,.labA,.labB,.sweep,.pulse{animation:none}}
  </style>

  <rect x=".5" y=".5" width="839" height="367" rx="14" fill="#0c1116" stroke="#1e262e"/>

  <!-- left: what -->
  <text x="34" y="118" class="sans ink" font-size="50" font-weight="700" letter-spacing="-1.2">Wisdom teeth,</text>
  <text x="34" y="174" class="sans teal" font-size="50" font-weight="700" letter-spacing="-1.2">measured.</text>
  <g class="sans soft" font-size="18">
    <text x="36" y="226">CANDID finds the nerve on a CBCT</text>
    <text x="36" y="252">and shows how close the tooth sits.</text>
  </g>
  <g class="mono" font-size="15">
    <circle class="pulse" cx="42" cy="301" r="4.5" fill="#71c176"/>
    <text x="56" y="306" class="teal">candidlabs.org →</text>
  </g>

  <!-- right: the scan -->
  <g transform="translate(424 28)">
    <rect width="388" height="312" rx="10" fill="#07090c"/>
    <g clip-path="url(#pane)">
      <!-- jaw bone -->
      <path d="M-10 128C60 112 120 118 180 122C250 128 320 104 400 96L400 330L-10 330Z" fill="url(#bone)"/>
      <path d="M-10 128C60 112 120 118 180 122C250 128 320 104 400 96L400 330L-10 330Z" fill="url(#trab)" opacity=".55"/>
      <path d="M-10 128C60 112 120 118 180 122C250 128 320 104 400 96" fill="none" stroke="#51606c" stroke-width="2" opacity=".8"/>
      <path d="M-10 296C120 304 280 300 400 272L400 330L-10 330Z" fill="#3a4753" opacity=".55"/>

      <!-- nerve canal: a dark tunnel with faint bright walls -->
      <path id="canal" d="M-10 250C80 262 170 262 252 246C310 234 360 205 400 170" fill="none" stroke="#0b0f13" stroke-width="17" stroke-linecap="round"/>
      <path d="M-10 241.500C80 253.500 170 253.500 250 237.800C307 226 356 198 396 163" fill="none" stroke="#6c7a86" stroke-width="1.2" opacity=".7"/>
      <path d="M-10 258.500C80 270.500 170 270.500 254 254.200C313 242 364 212 404 177" fill="none" stroke="#6c7a86" stroke-width="1.2" opacity=".7"/>

      <!-- teeth: first molar (cropped), second molar, impacted third molar -->
      <g filter="url(#soft)">
        <g transform="translate(-44 54) scale(.95)" opacity=".9"><use href="#toothArt"/></g>
        <g transform="translate(214 170) rotate(-52) scale(.95) translate(-50 -75)"><use href="#toothArt"/></g>
        <g transform="translate(60 52) scale(.95)"><use href="#toothArt"/></g>
      </g>

      <!-- scan sweep -->
      <rect class="sweep" x="0" y="0" width="140" height="312" fill="url(#sweep)"/>

      <!-- segmentation overlay -->
      <path class="canalFill" d="M-10 250C80 262 170 262 252 246C310 234 360 205 400 170" fill="none" stroke="#d3a63f" stroke-width="15" stroke-linecap="round"/>
      <path class="draw segCanal" pathLength="1" d="M-10 250C80 262 170 262 252 246C310 234 360 205 400 170" fill="none" stroke="#d3a63f" stroke-width="1.8" filter="url(#glow)"/>
      <g transform="translate(214 170) rotate(-52) scale(.95) translate(-50 -75)">
        <use class="segFill" href="#molar" fill="#5ecfc6"/>
        <use class="draw segTooth" href="#molar" fill="none" stroke="#5ecfc6" stroke-width="1.3" stroke-linejoin="round" filter="url(#glow)"/>
      </g>

      <!-- caliper: root tip to canal roof -->
      <g stroke-linecap="round" fill="none">
        <circle class="danger" cx="256.500" cy="235.500" r="11" stroke="#e5827a" stroke-width="1.6" filter="url(#glow)"/>
        <path class="draw caliper" pathLength="1" d="M250.500 233.200H262.500M250.500 238H262.500" stroke="#f4f7f9" stroke-width="1.3"/>
        <path class="draw caliper" pathLength="1" d="M264 243.500L286 274" stroke="#e5827a" stroke-width="1"/>
      </g>

      <!-- result labels -->
      <g class="labA mono">
        <rect x="262" y="270" width="116" height="30" rx="6" fill="#0c1116" stroke="#e5827a"/>
        <text x="320" y="290" text-anchor="middle" font-size="14" font-weight="700" fill="#e5827a">d = 0.4 mm</text>
      </g>
      <g class="labB mono">
        <rect x="206" y="270" width="172" height="30" rx="6" fill="#0c1116" stroke="#d3a63f"/>
        <text x="292" y="290" text-anchor="middle" font-size="13" font-weight="700" class="amber">unsure → no number</text>
      </g>

      <!-- anatomy tags -->
      <g class="mono" font-size="13">
        <text x="194" y="88" class="teal">38</text>
        <path d="M199 94L192 107" stroke="#5ecfc6" stroke-width="1"/>
        <text x="100" y="44" class="dim" text-anchor="middle">37</text>
        <text x="16" y="230" class="amber">IAN canal</text>
      </g>

      <rect width="388" height="312" fill="url(#vignette)"/>

      <!-- viewer overlay text -->
      <g class="mono dim" font-size="12">
        <text x="14" y="24">CBCT · 0.2 mm voxel</text>
        <text x="374" y="24" text-anchor="end">kVp: caffeine</text>
        <text x="14" y="298">slice 38 / ∞</text>
      </g>
    </g>
    <rect width="388" height="312" rx="10" fill="none" stroke="#293139"/>
  </g>

</svg>
